services:

  mysql:
    image: mysql:8.4
    container_name: blog-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: localrootpassword
      MYSQL_DATABASE: blogdb
      MYSQL_USER: bloguser
      MYSQL_PASSWORD: localblogpassword

    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"
        ]
      interval: 10s
      timeout: 5s
      retries: 10


  backend:
    build:
      context: ./backend

    container_name: blog-backend

    environment:
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: bloguser
      DB_PASSWORD: localblogpassword
      DB_NAME: blogdb
      JWT_SECRET: local-development-secret-change-me
      CORS_ORIGIN: "*"

    depends_on:
      mysql:
        condition: service_healthy

    ports:
      - "5000:5000"

    networks:
      default:
        aliases:
          - backend-service


  frontend:
    build:
      context: ./frontend

    container_name: blog-frontend

    depends_on:
      - backend

    ports:
      - "3000:8080"


volumes:
  mysql-data: