apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor

metadata:

  name: backend-monitor

  namespace: monitoring

  labels:
    release: monitoring

spec:

  namespaceSelector:
    matchNames:
      - blogapp

  selector:
    matchLabels:
      app: backend

  endpoints:

    - port: http
      path: /metrics
      interval: 30s